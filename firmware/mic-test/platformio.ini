[env:mic-test]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=0

[env:mic-record]
extends = env:mic-test
monitor_speed = 921600
build_flags =
    ${env:mic-test.build_flags}
    -D ECHOCRAFT_RECORD=1

[env:mic-denoise]
extends = env:mic-record
build_flags =
    ${env:mic-record.build_flags}
    -D ECHOCRAFT_DENOISE=1

[env:mic-usb-app]
extends = env:mic-denoise
build_unflags = -D ARDUINO_USB_MODE=1
build_flags =
    ${env:mic-denoise.build_flags}
    -D ARDUINO_USB_MODE=0
    -D ECHOCRAFT_NATIVE_USB=1

[env:mic-usb-uac]
extends = env:mic-usb-app
build_flags =
    ${env:mic-usb-app.build_flags}
    -D ECHOCRAFT_UAC=1
